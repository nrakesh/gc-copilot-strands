[project]
name = "gc2-copilot-strands"
version = "0.1.0"
description = "GrandCentral pipeline planner using AWS Strands Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.0.0",
    "anthropic>=0.69.0",
    "openai>=1.60.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "boto3>=1.35.0",
    "bedrock-agentcore-starter-toolkit>=0.1.27",
    "chromadb>=1.3.0",
    "sentence-transformers>=5.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
